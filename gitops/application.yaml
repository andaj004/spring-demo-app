apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/spring-demo-app.git' # UPDATE THIS
    targetRevision: HEAD
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
