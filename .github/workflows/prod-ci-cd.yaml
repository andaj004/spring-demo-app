name: Prod CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - main

env:
  DOCKER_IMAGE: andaj/spring-app-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }},${{ env.DOCKER_IMAGE }}:latest

      - name: Update Helm Values for GitOps
        run: |
          # Use sed to update the image tag in helm/values.yaml
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" helm/values.yaml
          
          # Commit the updated values.yaml
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git commit -am "Update prod image tag to ${{ github.sha }} [skip ci]"
          
          # Push changes back to the prod branch (or main if that's the default)
          git push origin HEAD
