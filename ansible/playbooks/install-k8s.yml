---
- name: Setup Prerequisites on all nodes
  hosts: all
  become: yes
  tasks:
    - name: Disable swap
      command: swapoff -a
    
    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Load kernel modules for containerd
      copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter
    
    - name: Load overlay module
      modprobe:
        name: overlay
        state: present
    
    - name: Load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present

    - name: Setup sysctl params for k8s
      copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply sysctl params without reboot
      command: sysctl --system

    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg2
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Install containerd
      apt:
        name: containerd.io
        state: present

    - name: Configure containerd
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Set SystemdCgroup in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Add Google Cloud public signing key
      apt_key:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        state: present

    - name: Add Kubernetes APT repository
      apt_repository:
        repo: deb https://apt.kubernetes.io/ kubernetes-xenial main
        state: present
        filename: kubernetes.list

    - name: Install kubelet, kubeadm and kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
      notify: Restart kubelet

    - name: Mark kubelet, kubeadm and kubectl as hold
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: yes

- name: Initialize Primary Control Plane
  hosts: control_plane[0]
  become: yes
  tasks:
    - name: Initialize the Kubernetes cluster
      command: >
        kubeadm init 
        --pod-network-cidr=10.244.0.0/16 
        --upload-certs
      register: kubeadm_init
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Setup kubeconfig for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes

    - name: Setup kubeconfig for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Copy admin.conf to ubuntu's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu

    - name: Install Calico pod network
      become: false
      command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.25.0/manifests/calico.yaml

    - name: Generate join command for workers
      command: kubeadm token create --print-join-command
      register: worker_join_command
      changed_when: false

    - name: Generate certificate key for control planes
      command: kubeadm init phase upload-certs --upload-certs
      register: control_plane_cert_key
      changed_when: false
      when: groups['control_plane'] | length > 1

    - name: Dummy task to store join info
      set_fact:
        join_command: "{{ worker_join_command.stdout_lines[0] }}"
        cert_key: "{{ control_plane_cert_key.stdout_lines[2] if groups['control_plane'] | length > 1 else '' }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] }}"

- name: Join Secondary Control Planes
  hosts: control_plane[1:]
  any_errors_fatal: true
  become: yes
  tasks:
    - name: Join the Kubernetes cluster as control plane
      command: "{{ join_command }} --control-plane --certificate-key {{ cert_key }}"
      args:
        creates: /etc/kubernetes/admin.conf

- name: Join Worker Nodes
  hosts: worker
  become: yes
  tasks:
    - name: Join the Kubernetes cluster as worker
      command: "{{ join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
